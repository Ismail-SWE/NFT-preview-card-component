<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | NFT preview card component</title>
  <link rel="stylesheet" href="sass.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

</head>
<body>

  <article class="main-container">

  <div class="nft-image">
    <img src="images/image-equilibrium.jpg" alt="image of nft">
    <div class="overlay">
        <img src="images/icon-view.svg" alt="view">
    </div>
  </div>

  <h1 class="nft-name">Equilibrium #3429</h1>

  <p class="nft-info">Our Equilibrium collection promotes balance and calm.</p>

  <div class="meta-row">
    <p class="nft-price"><span><img src="images/icon-ethereum.svg" alt="" aria-hidden="true"></span> 0.041 ETH</p>
    <p class="nft-time"> <span><img src="images/icon-clock.svg" alt="" aria-hidden="true"></span> 3 days left</p> 
  </div>

  <hr>

  <div class="creator">
    <img src="images/image-avatar.png" alt="profile image">
    <p> <span>Creation of</span> Jules Wyvern</p>
  </div>

  </article>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Ismailov K</a>.
  </footer>
</body>
</html>
